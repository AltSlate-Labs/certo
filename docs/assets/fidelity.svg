<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Posterior fidelity by training target, held-out wording, log scale. soft KL 0.0037 sits below the symbolic-model ceiling of 0.012; sampled KL 0.723 and argmax KL 0.613 sit at the ignore-evidence prior baseline of 0.605. Lower is better.">
  <rect x="0" y="0" width="920" height="560" fill="#F4F6F3"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#1E2A2E">Recovering the answer from language</text>
  <text x="40" y="68" font-size="14" fill="#59666B">Posterior fidelity KL(r||p) by training target · ModernBERT reads English · held-out wording · log scale, lower = better</text>

  <!-- gridlines + y ticks (log: 0.001,0.01,0.1,1) -->
  <g font-size="12" fill="#59666B">
    <line x1="120" y1="470" x2="860" y2="470" stroke="#D6DCD8"/><text x="112" y="474" text-anchor="end">0.001</text>
    <line x1="120" y1="347" x2="860" y2="347" stroke="#EAEEEB"/><text x="112" y="351" text-anchor="end">0.01</text>
    <line x1="120" y1="225" x2="860" y2="225" stroke="#EAEEEB"/><text x="112" y="229" text-anchor="end">0.1</text>
    <line x1="120" y1="102" x2="860" y2="102" stroke="#EAEEEB"/><text x="112" y="106" text-anchor="end">1</text>
  </g>
  <text x="34" y="290" font-size="12" fill="#59666B" transform="rotate(-90 34 290)" text-anchor="middle">KL to exact answer</text>

  <!-- reference lines -->
  <line x1="120" y1="338" x2="860" y2="338" stroke="#0E7C86" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="126" y="332" font-size="12" fill="#0E7C86" text-anchor="start">symbolic-model ceiling  0.012</text>
  <line x1="120" y1="129" x2="860" y2="129" stroke="#B5651D" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="126" y="123" font-size="12" fill="#B5651D" text-anchor="start">ignore-evidence prior  0.605</text>

  <!-- bars: soft(0.0037) sampled(0.723) argmax(0.613) -->
  <g>
    <rect x="200" y="400" width="110" height="70" rx="4" fill="#0E7C86"/>
    <text x="255" y="392" font-size="14" font-weight="700" fill="#0E7C86" text-anchor="middle">0.0037</text>
    <text x="255" y="492" font-size="14" fill="#1E2A2E" text-anchor="middle">soft</text>
    <text x="255" y="510" font-size="11.5" fill="#59666B" text-anchor="middle">full distribution</text>

    <rect x="420" y="119" width="110" height="351" rx="4" fill="#7A8791"/>
    <text x="475" y="111" font-size="14" font-weight="700" fill="#59666B" text-anchor="middle">0.723</text>
    <text x="475" y="492" font-size="14" fill="#1E2A2E" text-anchor="middle">sampled</text>
    <text x="475" y="510" font-size="11.5" fill="#59666B" text-anchor="middle">one label ∼ r</text>

    <rect x="640" y="128" width="110" height="342" rx="4" fill="#7A8791"/>
    <text x="695" y="120" font-size="14" font-weight="700" fill="#59666B" text-anchor="middle">0.613</text>
    <text x="695" y="492" font-size="14" fill="#1E2A2E" text-anchor="middle">argmax</text>
    <text x="695" y="510" font-size="11.5" fill="#59666B" text-anchor="middle">winning label</text>
  </g>

  <!-- annotations -->
  <text x="255" y="430" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">≈ exact</text>
  <text x="585" y="300" font-size="12.5" fill="#59666B" text-anchor="middle">single-label ≈ ignoring the evidence</text>

  <text x="40" y="544" font-size="12" fill="#59666B">Training on the full posterior recovers the exact answer from prose; both single-label targets fail (seed 0; robustness in the companion figure).</text>
</svg>
